version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecb-postgres
    environment:
      POSTGRES_USER: ecb_user
      POSTGRES_PASSWORD: ecb_password
      POSTGRES_DB: ecb_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecb_user -d ecb_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ecb-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

volumes:
  postgres_data:
